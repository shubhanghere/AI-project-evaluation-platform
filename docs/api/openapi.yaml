  "components": {
    "schemas": {
      "Criterion": {
        "properties": {
          "key": {
            "type": "string",
            "title": "Key"
          },
          "name": {
            "type": "string",
            "title": "Name"
          },
          "weight": {
            "type": "number",
            "maximum": 100.0,
            "exclusiveMinimum": 0.0,
            "title": "Weight"
          }
        },
        "type": "object",
        "required": [
          "key",
          "name",
          "weight"
        ],
        "title": "Criterion"
      },
      "EvalIn": {
        "properties": {
          "idempotency_key": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "title": "Idempotency Key"
          },
          "rubric_id": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Rubric Id"
          }
        },
        "type": "object",
        "required": [
          "idempotency_key"
        ],
        "title": "EvalIn"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ReviewIn": {
        "properties": {
          "reviewer_id": {
            "type": "string",
            "title": "Reviewer Id"
          },
          "decision": {
            "type": "string",
            "pattern": "^(approve|reject)$",
            "title": "Decision"
          },
          "comment": {
            "type": "string",
            "title": "Comment",
            "default": ""
          }
        },
        "type": "object",
        "required": [
          "reviewer_id",
          "decision"
        ],
        "title": "ReviewIn"
      },
      "RubricIn": {
        "properties": {
          "name": {
            "type": "string",
            "title": "Name"
          },
          "criteria": {
            "items": {
              "$ref": "#/components/schemas/Criterion"
            },
            "type": "array",
            "title": "Criteria"
          }
        },
        "type": "object",
        "required": [
          "name",
          "criteria"
        ],
        "title": "RubricIn"
      },
      "SubmissionIn": {
        "properties": {
          "student_id": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1,
            "title": "Student Id"
          },
          "course_id": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1,
            "title": "Course Id"
          },
          "assignment_id": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1,
            "title": "Assignment Id"
          },
          "title": {
            "type": "string",
            "maxLength": 240,
            "minLength": 1,
            "title": "Title"
          },
          "content": {
            "type": "string",
            "maxLength": 500000,
            "title": "Content",
            "default": ""
          }
        },
        "type": "object",
        "required": [
          "student_id",
          "course_id",
          "assignment_id",
          "title"
        ],
        "title": "SubmissionIn"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}